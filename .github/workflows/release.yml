# .github/workflows/release.yml
# Workflow sur le repo PUBLIC kno-by-Fdevelopment-LTD/kno.
# Déclenché par repository_dispatch envoyé depuis le repo privé kaneda59/Kno.
# Clone le code source privé via PAT_READ_PRIVATE, compile pour 4 plateformes,
# puis publie une GitHub Release SUR CE REPO avec les binaires attachés.
#
# Avantage : Actions illimité gratuit sur les repos publics → aucun quota à
# surveiller, même pour des dizaines de releases par mois.
#
# Secret requis :
#   PAT_READ_PRIVATE : fine-grained PAT avec Contents=Read-only
#                     sur kaneda59/Kno
name: Build and publish Kno release
on:
  repository_dispatch:
    types: [build-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à builder (ex: v1.9.7)'
        required: true
        type: string
      version:
        description: 'Version sans le v (ex: 1.9.7)'
        required: true
        type: string
permissions:
  contents: write   # nécessaire pour gh release create sur ce même repo
env:
  PYTHON_VERSION: '3.11'
  PYINSTALLER_VERSION: '>=6.0,<7.0'
  LLAMA_CPP_VERSION: '0.2.90'
jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # PREPARE — normalise les paramètres venant des deux triggers possibles
  # ──────────────────────────────────────────────────────────────────────────
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      is_prerelease: ${{ steps.vars.outputs.is_prerelease }}
    steps:
      - name: Extract tag and version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag }}"
            VERSION="${{ github.event.client_payload.version }}"
          else
            TAG="${{ github.event.inputs.tag }}"
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [ -z "$TAG" ] || [ -z "$VERSION" ]; then
            echo "::error::Tag ou version manquant"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)[0-9]*)?$ ]]; then
            echo "::error::Version invalide : $VERSION"
            exit 1
          fi
          IS_PRE="false"
          if [[ "$VERSION" =~ -(beta|rc) ]]; then IS_PRE="true"; fi
          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRE"  >> "$GITHUB_OUTPUT"
          echo "::notice::Build Kno $TAG (version=$VERSION, prerelease=$IS_PRE)"
  # ──────────────────────────────────────────────────────────────────────────
  # BUILD WINDOWS
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: kaneda59/Kno
          token: ${{ secrets.PAT_READ_PRIVATE }}
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y
      - name: Create venv and install dependencies
        shell: pwsh
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip wheel setuptools
          (Get-Content requirements.txt) -notmatch '^llama-cpp-python' | Set-Content requirements-ci.txt
          venv\Scripts\pip.exe install -r requirements-ci.txt
          venv\Scripts\pip.exe install "llama-cpp-python==${{ env.LLAMA_CPP_VERSION }}" `
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu122 `
            --force-reinstall --no-cache-dir
          venv\Scripts\pip.exe install "pyinstaller${{ env.PYINSTALLER_VERSION }}" pyarmor
      - name: Prepare sources
        shell: pwsh
        run: venv\Scripts\python.exe ci\prepare_build.py "${{ needs.prepare.outputs.version }}"
      - name: Compile with PyInstaller
        shell: pwsh
        run: |
          venv\Scripts\pyinstaller.exe --clean --noconfirm kno.spec
          if (-not (Test-Path "dist\kno\kno.exe")) {
            Write-Error "dist\kno\kno.exe introuvable"
            exit 1
          }
          Write-Host "OK dist\kno\kno.exe genere"
      - name: Prepare release/ folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release\kno -Force | Out-Null
          Copy-Item -Recurse -Force dist\kno\* release\kno\
          '{"model_path": "", "admin_password": "admin"}' | Set-Content release\kno\config.json
          New-Item -ItemType Directory -Path release\kno\models -Force | Out-Null
      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $VERSION = "${{ needs.prepare.outputs.version }}"
          if (-not (Test-Path "installer\kno_setup.iss")) {
            Write-Error "installer\kno_setup.iss introuvable dans le repo"
            exit 1
          }
          New-Item -ItemType Directory -Path release\installer -Force | Out-Null
          if (-not (Test-Path "installer\config.default.json")) {
            '{"model_path": "", "admin_password": "admin"}' | Set-Content installer\config.default.json
          }
          if (-not (Test-Path "assets\icon_32.ico")) {
            Write-Host "::warning::assets\icon_32.ico introuvable - SetupIconFile commentee"
            $issPath = "installer\kno_setup.iss"
            $content = Get-Content $issPath -Raw
            $content = $content -replace '(?m)^SetupIconFile=', '; SetupIconFile='
            Set-Content -Path $issPath -Value $content -NoNewline
          }
          Push-Location installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$VERSION kno_setup.iss
          $iscc_code = $LASTEXITCODE
          Pop-Location
          if ($iscc_code -ne 0) {
            Write-Error "Inno Setup a echoue (code $iscc_code)"
            exit 1
          }
          $installer = Get-ChildItem release\installer\Kno-Setup-*-windows.exe | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Installer Inno Setup non genere"
            exit 1
          }
          $sizeMB = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "OK Installer cree : $($installer.Name) ($sizeMB MB)"
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/installer/Kno-Setup-*-windows.exe
          retention-days: 7
          if-no-files-found: error
  # ──────────────────────────────────────────────────────────────────────────
  # BUILD LINUX
  # ──────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux tarball
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: kaneda59/Kno
          token: ${{ secrets.PAT_READ_PRIVATE }}
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libffi-dev libssl-dev
      - name: Create venv and install dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip wheel setuptools
          grep -v '^llama-cpp-python' requirements.txt > requirements-ci.txt
          venv/bin/pip install -r requirements-ci.txt
          # llama-cpp-python : on installe le wheel CUDA cu122 comme dans
          # build.sh local. Crucial parce que ce wheel tire les mêmes
          # dépendances transitives que sur ta machine (pandas, numpy, etc.).
          # Au runtime le binaire tournera en CPU chez les clients sans CUDA
          # installé (fallback automatique de llama.cpp).
          venv/bin/pip install "llama-cpp-python==${{ env.LLAMA_CPP_VERSION }}" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu122 \
            --force-reinstall --no-cache-dir
          venv/bin/pip install "pyinstaller${{ env.PYINSTALLER_VERSION }}" pyarmor
      - name: Prepare sources
        run: venv/bin/python ci/prepare_build.py "${{ needs.prepare.outputs.version }}"
      - name: Compile with PyInstaller
        run: |
          venv/bin/pyinstaller --clean --noconfirm kno.spec
          if [ ! -f "dist/kno/kno" ]; then
            echo "::error::dist/kno/kno introuvable"
            exit 1
          fi
          file dist/kno/kno
      - name: Package tarball
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          ARCHIVE_NAME="Kno-linux-x64-$TAG.tar.gz"
          mkdir -p release/installer
          # Structure de l'archive (identique à celle qui marchait sur les
          # versions précédentes : ouvert avec un gestionnaire d'archives,
          # double-clic sur "kno" suffit pour lancer le binaire) :
          #   kno/
          #     _internal/    (libs PyInstaller : libpython3.11.so.1.0, etc.)
          #     models/       (dossier vide pour que l'utilisateur dépose ses GGUF)
          #     config.json
          #     kno           (binaire exécutable principal)
          TMP_PACK=$(mktemp -d)
          mkdir -p "$TMP_PACK/kno"
          cp -r dist/kno/. "$TMP_PACK/kno/"
          echo '{"model_path": "", "admin_password": "admin"}' > "$TMP_PACK/kno/config.json"
          mkdir -p "$TMP_PACK/kno/models"
          # S'assure que le binaire kno est exécutable
          chmod +x "$TMP_PACK/kno/kno"
          tar -czf "release/installer/$ARCHIVE_NAME" -C "$TMP_PACK" kno
          rm -rf "$TMP_PACK"
          ls -lh "release/installer/$ARCHIVE_NAME"
          echo "OK tarball cree"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: release/installer/Kno-linux-x64-*.tar.gz
          retention-days: 7
          if-no-files-found: error
  # ──────────────────────────────────────────────────────────────────────────
  # BUILD MACOS APPLE SILICON
  # ──────────────────────────────────────────────────────────────────────────
  build-macos-arm:
    name: Build macOS (Apple Silicon arm64) signé + notarisé
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: kaneda59/Kno
          token: ${{ secrets.PAT_READ_PRIVATE }}
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64
          cache: 'pip'
      - name: Create venv and install dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip wheel setuptools
          grep -v '^llama-cpp-python' requirements.txt > requirements-ci.txt
          venv/bin/pip install -r requirements-ci.txt
          venv/bin/pip install "llama-cpp-python==${{ env.LLAMA_CPP_VERSION }}" --force-reinstall --no-cache-dir
          venv/bin/pip install "pyinstaller${{ env.PYINSTALLER_VERSION }}" pyarmor
      - name: Prepare sources
        run: venv/bin/python ci/prepare_build.py "${{ needs.prepare.outputs.version }}"
      - name: Compile with PyInstaller
        run: |
          venv/bin/pyinstaller --clean --noconfirm kno.spec
          [ -f "dist/kno/kno" ] || (echo "::error::dist/kno/kno introuvable" && exit 1)
      - name: Package, sign, notarize, staple
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
          DEVID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e

          # ── Import du certificat dans un trousseau dédié, dans le MÊME step
          #    que la signature (sinon l'état du trousseau se perd entre steps,
          #    d'où le "item could not be found in the keychain" précédent) ──
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          # AJOUTE le trousseau à la liste de recherche de codesign (le point
          # qui manquait : "default-keychain" seul ne suffit pas).
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Garde-fou : si aucune identité Developer ID, on s'arrête net.
          security find-identity -v -p codesigning "$KEYCHAIN"
          if [ "$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c 'Developer ID Application')" -lt 1 ]; then
            echo "::error::Aucune identite 'Developer ID Application' dans le trousseau — verifie MACOS_CERTIFICATE / MACOS_CERTIFICATE_PWD"
            exit 1
          fi

          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          DMG_NAME="Kno-$TAG-macos-arm64.dmg"
          ENT="$GITHUB_WORKSPACE/installer/entitlements_macos.plist"
          mkdir -p release/installer
          STAGE=$(mktemp -d); APP="$STAGE/Kno.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/kno_engine"
          cp -R dist/kno/. "$APP/Contents/Resources/kno_engine/"
          echo '{"model_path": "", "admin_password": "admin"}' > "$APP/Contents/Resources/kno_engine/config.json"
          mkdir -p "$APP/Contents/Resources/kno_engine/models"
          cat > "$APP/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Kno</string>
            <key>CFBundleDisplayName</key><string>Kno</string>
            <key>CFBundleIdentifier</key><string>eu.fdevelopment.kno</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleExecutable</key><string>Kno</string>
            <key>CFBundleIconFile</key><string>kno.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          cat > "$APP/Contents/MacOS/Kno" << 'LAUNCHER'
          #!/bin/bash
          BUNDLE="$(cd "$(dirname "$0")/../.." && pwd)"
          ENGINE="$BUNDLE/Contents/Resources/kno_engine"
          export DYLD_LIBRARY_PATH="$ENGINE/_internal:$ENGINE:${DYLD_LIBRARY_PATH:-}"
          USER_DIR="$HOME/Library/Application Support/Kno"
          mkdir -p "$USER_DIR/models" "$USER_DIR/data" "$USER_DIR/vectorstore"
          [ ! -f "$USER_DIR/config.json" ] && cp "$ENGINE/config.json" "$USER_DIR/config.json"
          export KNO_HOME="$USER_DIR"
          (sleep 3 && open http://localhost:8000) &
          cd "$ENGINE"; exec ./kno
          LAUNCHER
          chmod +x "$APP/Contents/MacOS/Kno"
          if [ -f "assets/kno_icon.png" ]; then
            ICONSET=$(mktemp -d)/kno.iconset; mkdir -p "$ICONSET"
            for SIZE in 16 32 64 128 256 512; do
              sips -z $SIZE $SIZE assets/kno_icon.png --out "$ICONSET/icon_${SIZE}x${SIZE}.png" >/dev/null
              D=$((SIZE*2)); sips -z $D $D assets/kno_icon.png --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" >/dev/null
            done
            iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/kno.icns"
          fi
          # ── Signature (libs natives -> binaire -> launcher -> bundle) ──
          find "$APP/Contents/Resources/kno_engine" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 \
            | xargs -0 -n1 codesign --force --timestamp --options runtime --sign "$DEVID"
          codesign --force --timestamp --options runtime --entitlements "$ENT" --sign "$DEVID" "$APP/Contents/Resources/kno_engine/kno"
          codesign --force --timestamp --options runtime --sign "$DEVID" "$APP/Contents/MacOS/Kno"
          codesign --force --timestamp --options runtime --entitlements "$ENT" --sign "$DEVID" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          # ── Notarisation (zip de l'app) + staple ──
          ditto -c -k --keepParent "$APP" "$STAGE/Kno.zip"
          xcrun notarytool submit "$STAGE/Kno.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          # ── DMG depuis l'app notariée + staple du dmg ──
          DMG_STAGE=$(mktemp -d); cp -R "$APP" "$DMG_STAGE/"; ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "Kno $VERSION" -srcfolder "$DMG_STAGE" -ov -format UDZO "release/installer/$DMG_NAME"
          xcrun stapler staple "release/installer/$DMG_NAME" || true
          ls -lh "release/installer/$DMG_NAME"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-dmg
          path: release/installer/Kno-*-macos-arm64.dmg
          retention-days: 7
          if-no-files-found: error
  # ──────────────────────────────────────────────────────────────────────────
  # PUBLISH — Crée la release sur CE repo (public) avec les 4 artefacts
  # ──────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish release
    needs: [prepare, build-windows, build-linux, build-macos-arm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source repo (for changelog)
        uses: actions/checkout@v4
        with:
          repository: kaneda59/Kno
          token: ${{ secrets.PAT_READ_PRIVATE }}
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Collect artifacts
        run: |
          mkdir -p release_assets
          find artifacts/ -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.tar.gz" \) -exec cp {} release_assets/ \;
          echo "Fichiers a publier :"
          ls -lh release_assets/
          COUNT=$(ls release_assets/ | wc -l)
          if [ "$COUNT" -lt 3 ]; then
            echo "::error::Attendu 3 artefacts, trouve $COUNT"
            exit 1
          fi
      - name: Extract release notes from CHANGELOG.md
        run: |
          python ci/extract_changelog.py "${{ needs.prepare.outputs.version }}" > release_notes_body.md
          cat release_notes_body.md
      - name: Build full release notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          {
            echo "## Kno $TAG"
            echo ""
            cat release_notes_body.md
            echo ""
            echo "---"
            echo ""
            echo "### Installation Windows"
            echo "Téléchargez \`Kno-Setup-$TAG-windows.exe\` et lancez l'installeur (Windows 10/11 64-bit)."
            echo ""
            echo "### Installation Linux"
            echo "Téléchargez \`Kno-linux-x64-$TAG.tar.gz\`, extrayez avec votre gestionnaire d'archives, puis double-cliquez sur le fichier \`kno\` dans le dossier extrait."
            echo ""
            echo "Ou en ligne de commande :"
            echo "\`\`\`bash"
            echo "tar -xzf Kno-linux-x64-$TAG.tar.gz"
            echo "cd kno && ./kno"
            echo "\`\`\`"
            echo "L'interface s'ouvre sur http://localhost:8000"
            echo ""
            echo "### Installation macOS (Apple Silicon M1/M2/M3/M4)"
            echo "Téléchargez \`Kno-$TAG-macos-arm64.dmg\`, double-cliquez, puis glissez \`Kno.app\` dans le dossier Applications."
            echo ""
            echo "L'app est **signée Developer ID + notarisée Apple** : elle s'ouvre directement, sans blocage Gatekeeper."
            echo ""
            echo "Sur Apple Silicon, l'inférence utilise automatiquement le GPU Metal."
            echo ""
            echo "---"
            echo "*Site : https://kno.fdevelopment.eu — Support : contact@fdevelopment.eu*"
          } > release_notes.md
          cat release_notes.md
      - name: Create release on this (public) repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          IS_PRE="${{ needs.prepare.outputs.is_prerelease }}"
          PUBLIC_REPO="${{ github.repository }}"
          ARGS=(
            "$TAG"
            release_assets/*
            --repo "$PUBLIC_REPO"
            --title "Kno $TAG"
            --notes-file release_notes.md
            --target main
          )
          if [ "$IS_PRE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          if gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            echo "::warning::La release $TAG existe deja - suppression et recreation"
            gh release delete "$TAG" --repo "$PUBLIC_REPO" --yes
          fi
          gh release create "${ARGS[@]}"
          echo "::notice::Release publiee sur https://github.com/$PUBLIC_REPO/releases/tag/$TAG"
